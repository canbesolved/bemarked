<!doctype html>
<!-- SPDX-License-Identifier: GPL-2.0-only -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bmkd</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <button id="navToggle" class="icon-btn" aria-label="Menu">☰</button>
    <span class="topbar-title">bmkd</span>
  </header>
  <div id="navBackdrop"></div>
  <div id="resizer" title="Drag to resize"></div>

  <aside id="side">
    <div class="side-head">
      <h1>bmkd</h1>
      <div class="side-head-actions">
        <button id="newBtn" class="btn-add" title="New bookmark">+ Add</button>
        <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"></button>
      </div>
    </div>
    <button id="allBookmarks" class="tree-node active">Homepage</button>
    <nav id="folderTree"></nav>
  </aside>

  <main id="main">
    <div class="search-wrap" id="searchWrap">
      <input id="search" placeholder="Search name, folder, url…" autocomplete="off">
    </div>

    <section id="shortcuts"></section>

    <div class="table-wrap">
      <table id="table" hidden>
        <thead><tr><th>Name</th><th>Folder</th><th>URL</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="empty" hidden>No bookmarks.</p>
  </main>

  <!-- add/edit form: dropdown overlay, opened by "+ New bookmark" / Edit -->
  <div id="overlay" hidden>
    <form id="form">
      <h2 id="f-title">New bookmark</h2>
      <input type="hidden" id="f-id">
      <input id="f-name" placeholder="Name" required>
      <input id="f-folder" placeholder="Folder (e.g. dev/sources)" list="folderOptions" autocomplete="off">
      <datalist id="folderOptions"></datalist>
      <input id="f-url" placeholder="https://…" required>
      <div class="form-actions">
        <button type="submit" id="saveBtn">Save</button>
        <button type="button" id="cancelBtn">Cancel</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
