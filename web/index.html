<!doctype html>
<!-- SPDX-License-Identifier: GPL-2.0-only -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bemarked - bookmarks manager</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="/assets/app_icon.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <button id="navToggle" class="icon-btn" aria-label="Menu">☰</button>
    <span class="topbar-title"><img src="/assets/app_icon.svg" alt="">bemarked</span>
  </header>
  <div id="navBackdrop"></div>
  <div id="resizer" title="Drag to resize"></div>

  <!-- top-right app menu -->
  <div id="appmenu">
    <button id="appmenuBtn" class="icon-btn appmenu-btn" title="Menu" aria-label="Menu"><span class="vdots"></span></button>
    <div id="appmenuList" class="app-menu" hidden>
      <button id="importBtn">Import bookmarks</button>
    </div>
  </div>
  <input id="importFile" type="file" accept=".html,.htm,text/html" hidden>
  <div id="toasts"></div>

  <aside id="side">
    <div class="side-head">
      <div class="side-brand">
        <button id="sideClose" class="side-close" aria-label="Close menu" title="Close menu"><img src="/assets/app_icon.svg" alt=""><span>bmkd</span></button>
        <img class="side-logo" src="/assets/app_icon.svg" alt="">
        <h1>bemarked</h1>
      </div>
      <div class="side-head-actions">
        <button id="newBtn" class="btn-add" title="New bookmark">+ Add</button>
        <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"></button>
      </div>
    </div>
    <button id="homepage" class="tree-node active">🏠 Homepage</button>
    <nav id="folderTree"></nav>
    <div id="sideFooter">
      <a href="https://x.com/thecanbesolved" target="_blank" rel="noopener noreferrer">Follow on X</a>
      <a href="https://github.com/canbesolved/bemarked" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://github.com/sponsors/canbesolved" target="_blank" rel="noopener noreferrer">❤️ Support us!</a>
    </div>
  </aside>

  <main id="main">
    <div class="search-wrap" id="searchWrap">
      <input id="search" placeholder="Search name, folder, url…" autocomplete="off">
    </div>

    <section id="shortcuts"></section>

    <div id="list" hidden></div>
    <p id="empty" class="empty" hidden>No bookmarks.</p>
  </main>

  <footer id="footer">
    <a href="https://x.com/thecanbesolved" target="_blank" rel="noopener noreferrer">Follow on X</a>
    <a href="https://github.com/canbesolved/bemarked" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a href="https://github.com/sponsors/canbesolved" target="_blank" rel="noopener noreferrer">❤️ Support us!</a>
  </footer>

  <!-- add/edit form: dropdown overlay, opened by "+ New bookmark" / Edit -->
  <div id="overlay" hidden>
    <form id="form">
      <h2 id="f-title">New bookmark</h2>
      <input type="hidden" id="f-id">
      <input id="f-name" placeholder="Name" required>
      <div class="field">
        <input id="f-folder" placeholder="Folder (e.g. dev/sources)" autocomplete="off">
        <div id="folderSuggest" class="suggest" hidden></div>
      </div>
      <input id="f-url" placeholder="https://…" required>
      <div class="form-actions">
        <button type="submit" id="saveBtn">Save</button>
        <button type="button" id="cancelBtn">Cancel</button>
      </div>
    </form>
  </div>

  <!-- new shortcut popup -->
  <div id="shortcutOverlay" hidden>
    <form id="shortcutForm">
      <h2 id="shortcutTitle">New shortcut</h2>
      <input id="sc-name" placeholder="Name" required>
      <div class="color-row">
        <input id="sc-color" placeholder="#4285f4" autocomplete="off">
        <input type="color" id="sc-color-picker" value="#4285f4" aria-label="Pick a color">
      </div>
      <input id="sc-url" placeholder="https://…" required>
      <div class="form-actions">
        <button type="submit">Save</button>
        <button type="button" id="sc-cancel">Cancel</button>
      </div>
    </form>
  </div>

  <!-- rename folder popup -->
  <div id="folderOverlay" hidden>
    <form id="folderForm">
      <h2>Rename folder</h2>
      <input type="hidden" id="fd-path">
      <input id="fd-name" placeholder="Folder name" required autocomplete="off">
      <div class="form-actions">
        <button type="submit">Save</button>
        <button type="button" id="fd-cancel">Cancel</button>
      </div>
    </form>
  </div>

  <!-- confirmation dialog -->
  <div id="confirmOverlay" hidden>
    <div id="confirmBox">
      <p id="confirmMsg"></p>
      <div class="form-actions">
        <button id="confirmOk" class="danger-btn">Delete</button>
        <button id="confirmCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
